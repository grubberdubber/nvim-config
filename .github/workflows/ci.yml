name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check init.lua lua tests

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5

      - name: Validate Lua syntax
        run: |
          nvim --headless -u NONE \
            -c "lua for _, f in ipairs(vim.fn.glob('lua/**/*.lua', false, true)) do assert(loadfile(f), f) end" \
            -c "qa"

      - name: Headless startup
        run: timeout 300 nvim --headless -u init.lua "+qa"

      - name: Install Tree-sitter CLI
        run: npm install -g tree-sitter-cli

      - name: Install test parsers
        run: timeout 600 nvim --headless -u init.lua "+TSInstallSync! html xml tsx css" +qa

      - name: Test suite
        run: |
          for spec in tests/*_spec.lua; do
            echo "::group::$spec"
            timeout 300 nvim --headless -u init.lua -c "luafile $spec"
            echo "::endgroup::"
          done

      - name: Markdown lint
        run: npx --yes markdownlint-cli2@0.24.1 --config markdownlint-cli2.yaml README.md AGENTS.md

      - name: ShellCheck
        run: shellcheck bootstrap.sh
