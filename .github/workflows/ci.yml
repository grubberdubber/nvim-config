name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expose the checkout as the Neovim config
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.config/nvim"

      - name: Cache plugins and parsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim
            ~/.cache/nvim
          key: nvim-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}

      - name: Formatting
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check init.lua lua tests

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.5

      - name: Validate Lua syntax
        run: |
          nvim --headless -u NONE \
            -c "lua for _, f in ipairs(vim.fn.glob('lua/**/*.lua', false, true)) do assert(loadfile(f), f) end" \
            -c "qa"

      - name: Headless startup
        run: |
          nvim --headless -u init.lua \
            "+lua print('modules=' .. tostring(package.loaded['options'] ~= nil and package.loaded['dashboard'] ~= nil))" \
            +qa 2>&1 | tee startup.log
          grep -q "modules=true" startup.log

      - name: Install CLI tools
        run: npm install -g tree-sitter-cli markdownlint-cli2@0.24.1

      - name: Install test parsers
        run: timeout 600 nvim --headless -u init.lua "+TSInstallSync! html xml tsx css" +qa

      - name: Test suite
        run: |
          for spec in tests/*_spec.lua; do
            echo "::group::$spec"
            if ! out=$(timeout 120 nvim --headless -u init.lua -c "luafile $spec" -c "qa!" 2>&1); then
              echo "$out"
              exit 1
            fi
            echo "$out"
            grep -q "0 failure(s)" <<<"$out" || exit 1
            echo "::endgroup::"
          done

      - name: Markdown lint
        run: markdownlint-cli2 --config markdownlint-cli2.yaml README.md AGENTS.md

      - name: ShellCheck
        run: shellcheck bootstrap.sh
